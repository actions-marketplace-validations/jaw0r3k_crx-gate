name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write
  id-token: write

jobs:
  dist-build:
    name: Build & Package Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: crx-gate-x86_64-unknown-linux-gnu.tar.gz
            bin_path: target/x86_64-unknown-linux-gnu/release/crx-gate
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: crx-gate-aarch64-unknown-linux-gnu.tar.gz
            bin_path: target/aarch64-unknown-linux-gnu/release/crx-gate
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: crx-gate-aarch64-apple-darwin.tar.gz
            bin_path: target/aarch64-apple-darwin/release/crx-gate
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: crx-gate-x86_64-apple-darwin.tar.gz
            bin_path: target/x86_64-apple-darwin/release/crx-gate
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: crx-gate-x86_64-pc-windows-msvc.zip
            bin_path: target/x86_64-pc-windows-msvc/release/crx-gate.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.artifact_name }} -C $(dirname ${{ matrix.bin_path }}) $(basename ${{ matrix.bin_path }})

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ${{ matrix.bin_path }} -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: Publish NPX Runner Package
    needs: dist-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        run: |
          cd npm
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
